<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="edge" x1="14" y1="18" x2="114" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.45" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- brain silhouette: two hemispheres split by a central sulcus -->
  <g stroke="url(#edge)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 24c-9-9-24-8-31 1-9-2-17 5-17 14 0 4 1 7 3 10-5 5-6 13-2 19-3 6-1 14 5 18 1 9 9 15 18 14 5 6 14 7 20 2 1.5-1.3 2.5-3 3-4.8V24z"/>
    <path d="M64 24c9-9 24-8 31 1 9-2 17 5 17 14 0 4-1 7-3 10 5 5 6 13 2 19 3 6 1 14-5 18-1 9-9 15-18 14-5 6-14 7-20 2-1.5-1.3-2.5-3-3-4.8V24z"/>
  </g>

  <!-- circuit traces: the "artificial" half -->
  <g stroke="url(#edge)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M40 46h14v18H34"/>
    <path d="M54 64v22"/>
    <path d="M88 46H74v18h20"/>
    <path d="M74 64v22"/>
    <path d="M40 84h14"/>
    <path d="M88 84H74"/>
    <path d="M64 34v12"/>
  </g>

  <!-- nodes -->
  <g fill="#0b0d12" stroke="url(#edge)" stroke-width="3.2">
    <circle cx="40" cy="46" r="5"/>
    <circle cx="34" cy="64" r="5"/>
    <circle cx="40" cy="84" r="5"/>
    <circle cx="54" cy="86" r="5"/>
    <circle cx="88" cy="46" r="5"/>
    <circle cx="94" cy="64" r="5"/>
    <circle cx="88" cy="84" r="5"/>
    <circle cx="74" cy="86" r="5"/>
  </g>

  <!-- core -->
  <circle cx="64" cy="60" r="16" fill="url(#core)" opacity="0.9"/>
  <circle cx="64" cy="60" r="6.5" fill="#e0f2fe"/>
</svg>
