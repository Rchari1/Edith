<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>SecondBrain</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="drag-strip"></div>
      <aside id="sidebar">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Search your memories" autocomplete="off" />
          <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
        </div>

        <nav class="note-list" id="note-list"></nav>

      </aside>

      <main id="stage">
        <canvas id="graph"></canvas>
        <div id="empty" class="empty hidden">
          <h2>No memories yet</h2>
          <p>Open <strong>Settings</strong> and run <strong>Backfill</strong> to distill the Claude sessions already on this machine &mdash; every session becomes a memory. Or just keep working; new memories form on their own.</p>
        </div>
        <div id="legend" class="legend">
          <div id="legend-cats" class="legend-row cats"></div>
          <div class="legend-row states">
            <span><i class="dot considered"></i>considered</span>
            <span><i class="dot opened"></i>opened</span>
            <span><i class="dot saved"></i>saved</span>
          </div>
        </div>
        <div id="tooltip" class="tooltip hidden"></div>
      </main>

      <section id="detail" class="detail hidden">
        <button class="close" id="detail-close" aria-label="Close">&times;</button>
        <h2 id="detail-title"></h2>
        <div class="detail-meta" id="detail-meta"></div>
        <div class="detail-body" id="detail-body"></div>
        <div class="detail-actions">
          <button id="btn-open-file">Open .md</button>
          <button id="btn-delete" class="danger">Delete</button>
        </div>
      </section>

      <section id="settings" class="modal hidden">
        <div class="modal-card">
          <h2>Settings</h2>
          <label>Anthropic API key
            <input id="set-key" type="password" placeholder="sk-ant-..." />
            <small>Used only to distill sessions into notes. Stored locally. Falls back to <code>ANTHROPIC_API_KEY</code>.</small>
          </label>
          <label>Model <input id="set-model" type="text" /></label>
          <label>Minimum turns to distill <input id="set-minturns" type="number" min="1" max="50" /></label>
          <label class="row"><input id="set-auto" type="checkbox" /> Distill new sessions automatically</label>
          <div class="modal-lib">
            <button id="btn-backfill" title="Ingest sessions already on disk">Backfill</button>
            <button id="btn-vault" title="Open the vault folder">Reveal vault</button>
          </div>
          <div class="modal-actions">
            <button id="set-cancel">Cancel</button>
            <button id="set-save" class="primary">Save</button>
          </div>
        </div>
      </section>

      <footer id="activity"><div id="activity-inner"></div></footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
