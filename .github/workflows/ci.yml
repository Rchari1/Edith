name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Does the core actually run on Windows? Nothing ships from this job; it is
  # here to find out what breaks before anyone promises a Windows build.
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: What build tooling does this runner have?
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -products * -property displayName } else { "no vswhere: no Visual Studio installer present" }
          "python: $(python --version 2>&1)"
      - name: Install, showing what the native module decides to do
        run: npm ci --foreground-scripts
      - name: Did it use a prebuilt binary or compile?
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.node node_modules/better-sqlite3 | Select-Object -ExpandProperty FullName
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  check:
    # Edith ships for macOS, and parts of the core read macOS paths, so the
    # checks run on the platform it is built for.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The native SQLite module compiles from source here, and the node-gyp it
      # uses still imports Python's distutils, which Python 3.12 removed. The
      # runners ship a newer Python, so pin one that still has it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci

      # The tests run inside Electron's own copy of Node, so the native SQLite
      # module has to be built against Electron rather than against Node.
      - name: Build native modules for Electron
        run: npx electron-builder install-app-deps

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
